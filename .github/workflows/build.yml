name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Descomprimir el zip
        run: unzip -q ./*.zip -d proyecto

      - name: Compilar
        run: |
          DIR=$(dirname "$(find proyecto -name gradlew | head -n 1)")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: runegolem-jar
          path: proyecto/**/build/libs/*.jar
